# Builds the MedGemma image next to Artifact Registry, so the ~15 GB never
# crosses a home connection and no local Docker is needed.
# Runbook: wiki/MedGemma-Cloud-Run-Deployment.md
#
#   gcloud builds submit medgemma/ \
#     --config=medgemma/cloudbuild.yaml \
#     --substitutions=_IMAGE=$IMAGE \
#     --timeout=3600s
#
# The default 10-minute timeout cannot pull 8 GB of weights and push 15 GB,
# hence --timeout on the command and the larger disk below.

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    # The Dockerfile's --mount=type=secret needs BuildKit, which is not the
    # default in this builder image.
    env: ['DOCKER_BUILDKIT=1']
    # Reads hf-token from Secret Manager into the build environment, so the
    # token is never an argument, a layer, or a line of shell history.
    secretEnv: ['HF_TOKEN']
    args:
      - -c
      - docker build --secret id=HF_TOKEN,env=HF_TOKEN -t $_IMAGE .

images: ['$_IMAGE']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/hf-token/versions/latest
      env: HF_TOKEN

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
