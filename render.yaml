# Render Blueprint — deploys the Fitnofat API (web service) and the PWA (static site).
# In the Render dashboard: New → Blueprint, point it at this repo.
# Fill in the Supabase + Gemini values (marked sync:false) per environment.

services:
  # ── Backend API ─────────────────────────────────────────────────────────
  - type: web
    name: fitnofat-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Switches the error handler to generic 500 messages (upstream errors can
      # carry key fragments and row contents) — keep this set in every
      # internet-facing environment.
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # Set to the deployed static site URL once known, e.g.
      # https://fitnofat-web.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional but recommended: Supabase → Settings → API → JWT Secret.
      # Lets the API verify access tokens in-process instead of making a network
      # call to Supabase on every single request. Projects using the newer
      # asymmetric signing keys can leave this unset — those verify via JWKS.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Gates /internal/ai-test, which makes a real (billable) model call.
      # Use the same value as the accounts service's ADMIN_API_KEY.
      - key: ADMIN_API_KEY
        sync: false
      # ── Medical AI (AI nutritionist + medical helper) ──────────────────
      # "auto" uses Vertex AI when the credentials below are filled in and
      # falls back to Gemini otherwise, so the feature works either way.
      - key: MEDICAL_AI_PROVIDER
        value: auto
      # Leave unset to use GEMINI_COACH_MODEL; set it to a medical-tuned
      # publisher model if your GCP project serves one (MedLM, the Med-PaLM 2
      # product, was retired by Google on 2025-09-29).
      - key: MEDICAL_AI_MODEL
        sync: false
      # Vertex needs a service account (OAuth), not an API key — grant it
      # roles/aiplatform.user and paste the key JSON (raw or base64). Enable the
      # API at console.cloud.google.com/apis/library/aiplatform.googleapis.com
      # (it is listed as "Gemini Enterprise Agent Platform" since April 2026).
      # Leave blank to run the medical desk on the Gemini API instead.
      - key: VERTEX_PROJECT_ID
        sync: false
      - key: VERTEX_LOCATION
        value: us-central1
      - key: VERTEX_SERVICE_ACCOUNT_JSON
        sync: false

  # ── Accounts microservice (auth + accounts + Stripe billing) ─────────────
  - type: web
    name: fitnofat-accounts
    runtime: node
    rootDir: accounts
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8090"
      # The static site URL (for CORS) and where Stripe redirects back to.
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      # Same Supabase project as the data API.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # See the note on the API service — same value, same purpose.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Stripe — Dashboard → Developers. Webhook endpoint: <this URL>/webhooks/stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: ADMIN_API_KEY
        sync: false

  # ── Admin panel (static) ─────────────────────────────────────────────────
  - type: web
    name: fitnofat-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # URL of the accounts microservice, e.g. https://fitnofat-accounts.onrender.com
      - key: VITE_ACCOUNTS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Frontend PWA (static) ────────────────────────────────────────────────
  - type: web
    name: fitnofat-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the deployed API URL, e.g. https://fitnofat-api.onrender.com
      - key: VITE_API_URL
        sync: false
      # Set to the deployed accounts service URL, e.g. https://fitnofat-accounts.onrender.com
      - key: VITE_ACCOUNTS_URL
        sync: false
    routes:
      # SPA fallback so client-side routes resolve.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
