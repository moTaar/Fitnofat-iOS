name: iOS → unsigned IPA (for Sideloadly)

# Builds the app on a GitHub macOS runner and uploads an UNSIGNED .ipa as a
# workflow artifact. Sideloadly (Windows) signs it with your own Apple ID
# when it installs it on your iPhone.
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build the app bundle
        run: npm run build:ios
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ACCOUNTS_URL: ${{ vars.VITE_ACCOUNTS_URL }}

      - run: npx cap sync ios

      - name: Build for device, unsigned
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry Fitnofat-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Fitnofat-unsigned-ipa
          path: ${{ runner.temp }}/ipa/Fitnofat-unsigned.ipa
          retention-days: 14
