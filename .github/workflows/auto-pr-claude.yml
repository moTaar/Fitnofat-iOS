name: Auto-Create PR for Claude Changes

on:
  push:
    branches:
      - claude-*  # Triggers when Claude pushes to any "claude-*" branch

permissions:
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      # The GitHub CLI that ships on the runner, rather than a third-party
      # action: repo-sync/pull-request-action, used before, no longer exists.
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is already open."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" --base main \
            --title "Review: Changes from Claude ($BRANCH)" \
            --reviewer "$ACTOR" \
            --body "## Claude-Generated Changes

          **Branch:** $BRANCH

          Please review the changes below before merging to main.

          ✅ Approve this PR to merge to main
          ❌ Request changes if needed"
