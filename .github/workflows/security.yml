# Is anything insecure on its way in?
#
# Dependencies with known vulnerabilities, credentials committed to the
# history, and code patterns that lead to injection, XSS, SSRF and the like.
# Also runs weekly, because new advisories are published without any code
# changing.
#
# The repository is public, so static analysis is CodeQL (free here, results
# in the Security tab). Tool images are pinned by digest: they read the whole
# repository.

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Every lockfile: the root one (local development, npm workspaces) and
      # each package's own (what Render and CI install). Development tools
      # included: they run here in CI and on developers' machines. High and
      # critical fail the check; a fix upstream has not shipped yet goes in
      # the package's `overrides`. All lockfiles are audited even after one
      # fails, so the log shows everything at once.
      #
      # Each package is audited from a copy outside the repository: inside
      # server/ or web/, npm finds the workspace root and audits the root
      # lockfile instead of the package's own.
      - name: Audit every lockfile
        run: |
          failed=""
          for dir in . server web accounts admin; do
            echo "::group::npm audit ($dir)"
            # Sibling directories, so no copy sits inside the root's copy.
            work="$RUNNER_TEMP/audit-$([ "$dir" = . ] && echo root || echo "$dir")"
            mkdir -p "$work"
            cp "$dir/package.json" "$dir/package-lock.json" "$work/"
            if ! (cd "$work" && npm audit --audit-level=high); then
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::High or critical advisories in:$failed"
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a key deleted in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false
      # False positives go in .gitleaksignore, one fingerprint each, with the
      # reason.
      - name: Scan every commit with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --exit-code 1 .

  codeql:
    name: Static analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        # The TypeScript of all four packages, and the workflows themselves
        # (script injection through untrusted `${{ }}` input, over-broad
        # tokens). The Swift shell in web/ios is a few generated lines and
        # would need a macOS build to analyse.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # Source-only analysis: no build needed for either language.
          build-mode: none
          queries: security-extended
      # Results go to the Security tab. On a pull request, GitHub also adds a
      # "CodeQL" check that fails when the change introduces a high-severity
      # alert; that is the check to require in branch protection.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
