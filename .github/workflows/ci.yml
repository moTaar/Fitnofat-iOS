# Does every package still typecheck, pass its tests and build?
#
# Runs on every pull request and every push to main. Render deploys the API,
# the accounts service and both static sites from main (render.yaml), so this
# is the last gate before production. The native iOS project is compiled
# separately, on macOS, by ios.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each of the four packages is installed and built from its own
        # directory — the same way Render builds them (render.yaml sets a
        # rootDir per service), so CI exercises the real deploy path rather
        # than a workspace-hoisted tree that only exists locally.
        package: [server, web, accounts, admin]

    # Job names are the package names; keep them, a branch-protection rule
    # may refer to them.
    name: ${{ matrix.package }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # render.yaml pins NODE_VERSION 22 for every service.
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      # Fails if the package's own lockfile has drifted from its package.json
      # (CLAUDE.md: `npm install` inside server/ or web/ updates the root
      # lockfile instead).
      - run: npm ci

      # `--if-present` so a package without one of these scripts is skipped
      # rather than failing the job. accounts and admin have no tests.
      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      # web includes rls.test.ts: the real schema and every migration applied
      # to an embedded Postgres (PGlite), checking the row-level security the
      # client relies on.
      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build
        env:
          # The Vite builds inline these at compile time; they only need to be
          # present and syntactically valid, not reachable.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_API_URL: https://example.invalid
          VITE_ACCOUNTS_URL: https://example.invalid

      # The bundle the iPhone app ships is a different build (no service
      # worker, virtual:pwa-register aliased to a no-op). ios.yml only runs on
      # macOS when the native project changes; this catches a web change that
      # breaks the iOS-mode build on every pull request, on Linux.
      - name: Build (iOS mode)
        if: matrix.package == 'web'
        run: npm run build:ios
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_API_URL: https://example.invalid
          VITE_ACCOUNTS_URL: https://example.invalid
